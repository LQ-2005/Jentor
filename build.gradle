plugins {
    id 'java'
}

group = 'com.tongji.cst3492.jentor'
version = '1.3.3'

// The compiler toolchain must be able to read the IntelliJ jars it compiles
// against. IntelliJ 2025.2-2026.1 ship Java 21 class files, 2026.2 ships Java 25
// class files, so a teammate on newer IDE builds passes -PjavaVersion=25.
def javaVersion = (providers.gradleProperty('javaVersion').orNull ?: '21') as int

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// Each teammate sets this to their own IntelliJ installation root in
// local.properties. IDEA_HOME / -PideaHome are supported as alternatives.
def configuredIdeaHome = localProperties.getProperty('ideaHome')
        ?: providers.gradleProperty('ideaHome').orNull
        ?: System.getenv('IDEA_HOME')
if (!configuredIdeaHome) {
    throw new GradleException(
            "Missing ideaHome. Copy local.properties.example to local.properties "
                    + "and set ideaHome to your IntelliJ installation root.")
}
def ideaHome = configuredIdeaHome.replace('\\', '/')
if (!file("${ideaHome}/lib").isDirectory()) {
    throw new GradleException(
            "ideaHome does not contain a lib directory: ${ideaHome}. "
                    + "Point it to the IntelliJ installation root, not to bin/.")
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: '*.jar')

    // Compile against the IDE that is already installed on this machine.
    // These jars are not packaged into the plugin.
    compileOnly fileTree(dir: "${ideaHome}/lib", include: '*.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    // Always emit Java 21 bytecode so one ZIP runs on both the Java 21 based
    // IDEs and the Java 25 based ones.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('compileRetrievalHarness', JavaCompile) {
    dependsOn tasks.named('classes')
    group = 'verification'
    description = 'Compiles the offline retrieval and citation harness.'
    source = files('tools/RetrievalHarness.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('retrieval-harness')
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('runRetrievalHarness', JavaExec) {
    dependsOn tasks.named('compileRetrievalHarness')
    group = 'verification'
    description = 'Runs the offline retrieval and citation harness.'
    classpath = files(
            layout.buildDirectory.dir('retrieval-harness'),
            sourceSets.main.output,
            sourceSets.main.runtimeClasspath,
            'src/main/resources'
    )
    mainClass = 'com.tongji.cst3492.jentor.tools.RetrievalHarness'
}

tasks.register('compilePdfIndexHarness', JavaCompile) {
    dependsOn tasks.named('classes')
    group = 'verification'
    description = 'Compiles the in-plugin PDF indexer CLI harness.'
    source = files('tools/PdfIndexHarness.java')
    classpath = sourceSets.main.runtimeClasspath
    destinationDirectory = layout.buildDirectory.dir('pdf-index-harness')
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('runPdfIndexHarness', JavaExec) {
    dependsOn tasks.named('compilePdfIndexHarness')
    group = 'verification'
    description = 'Runs the in-plugin PDF indexer; pass -Pmaterials=<directory>.'
    classpath = files(
            layout.buildDirectory.dir('pdf-index-harness'),
            sourceSets.main.output,
            sourceSets.main.runtimeClasspath
    )
    mainClass = 'com.tongji.cst3492.jentor.tools.PdfIndexHarness'
    def materials = providers.gradleProperty('materials').orNull
    if (materials != null) {
        def output = providers.gradleProperty('output').orNull
        if (output != null) {
            args materials, output
        } else {
            args materials
        }
    }
}

tasks.register('buildPlugin', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = "jentor-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(tasks.named('jar')) {
        into 'jentor/lib'
    }
    from('lib') {
        include '*.jar'
        into 'jentor/lib'
    }
}
